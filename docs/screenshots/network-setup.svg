<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">RadioDeck network setup</title>
  <desc id="d">The operator PC with RadioDeck and the radios are connected to the same Ethernet switch. Each receiver and transmitter has its own IP address. SIP, RTP and SNMP run over that network.</desc>

  <rect width="1000" height="600" fill="#101418"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#e6edf3">RadioDeck network setup</text>
  <text x="40" y="78" font-size="14" fill="#9aa7b2">The PC and the radios share one Ethernet network. RadioDeck calls each radio directly.</text>

  <!-- Operator PC -->
  <rect x="40" y="130" width="260" height="180" rx="10" fill="#1b2228" stroke="#2f3b45"/>
  <text x="60" y="164" font-size="17" font-weight="700" fill="#e6edf3">Operator PC</text>
  <text x="60" y="192" font-size="14" fill="#9aa7b2">Windows 10 / 11, 64-bit</text>
  <rect x="60" y="208" width="104" height="30" rx="6" fill="#0d6efd" fill-opacity="0.18" stroke="#2196f3"/>
  <text x="112" y="228" font-size="14" font-weight="700" fill="#64b5f6" text-anchor="middle">RadioDeck</text>
  <text x="60" y="270" font-size="12" fill="#9aa7b2">IP address</text>
  <text x="60" y="290" font-size="15" fill="#e6edf3" font-family="Consolas, Menlo, monospace">192.0.2.100</text>

  <!-- Headset -->
  <line x1="170" y1="310" x2="170" y2="350" stroke="#55636e" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="40" y="350" width="260" height="66" rx="10" fill="#1b2228" stroke="#2f3b45"/>
  <text x="60" y="378" font-size="13" font-weight="700" fill="#e6edf3">Headset or microphone + speakers</text>
  <text x="60" y="400" font-size="13" fill="#9aa7b2">PTT: keyboard key or foot switch</text>

  <!-- Radio groups -->
  <rect x="700" y="90" width="260" height="160" rx="10" fill="#1b2228" stroke="#2f3b45"/>
  <text x="716" y="116" font-size="15" font-weight="700" fill="#e6edf3">Radio 1</text>
  <path d="M936 100 v20 M928 100 l8 9 l8 -9" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-linecap="round"/>

  <rect x="700" y="280" width="260" height="160" rx="10" fill="#1b2228" stroke="#2f3b45"/>
  <text x="716" y="306" font-size="15" font-weight="700" fill="#e6edf3">Radio 2</text>
  <path d="M936 290 v20 M928 290 l8 9 l8 -9" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-linecap="round"/>

  <!-- Cables -->
  <g fill="none" stroke="#2196f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 230 H400"/>
    <path d="M600 230 H650"/>
    <path d="M650 150 V395"/>
    <path d="M650 150 H716"/>
    <path d="M650 205 H716"/>
    <path d="M650 340 H716"/>
    <path d="M650 395 H716"/>
  </g>
  <text x="350" y="220" font-size="12" fill="#9aa7b2" text-anchor="middle">Ethernet</text>

  <!-- Switch -->
  <rect x="400" y="180" width="200" height="100" rx="10" fill="#1b2228" stroke="#2196f3" stroke-width="1.5"/>
  <text x="500" y="214" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Ethernet switch</text>
  <text x="500" y="237" font-size="13" fill="#9aa7b2" text-anchor="middle">closed radio network</text>
  <text x="500" y="262" font-size="14" fill="#e6edf3" text-anchor="middle" font-family="Consolas, Menlo, monospace">192.0.2.0/24</text>

  <!-- Units -->
  <g font-size="14">
    <rect x="716" y="130" width="228" height="40" rx="6" fill="#11181d" stroke="#3a4853"/>
    <text x="730" y="155" fill="#e6edf3">Receiver</text>
    <text x="932" y="155" fill="#7ee0a0" text-anchor="end" font-family="Consolas, Menlo, monospace">192.0.2.10</text>

    <rect x="716" y="185" width="228" height="40" rx="6" fill="#11181d" stroke="#3a4853"/>
    <text x="730" y="210" fill="#e6edf3">Transmitter</text>
    <text x="932" y="210" fill="#7ee0a0" text-anchor="end" font-family="Consolas, Menlo, monospace">192.0.2.11</text>

    <rect x="716" y="320" width="228" height="40" rx="6" fill="#11181d" stroke="#3a4853"/>
    <text x="730" y="345" fill="#e6edf3">Receiver</text>
    <text x="932" y="345" fill="#7ee0a0" text-anchor="end" font-family="Consolas, Menlo, monospace">192.0.2.12</text>

    <rect x="716" y="375" width="228" height="40" rx="6" fill="#11181d" stroke="#3a4853"/>
    <text x="730" y="400" fill="#e6edf3">Transmitter</text>
    <text x="932" y="400" fill="#7ee0a0" text-anchor="end" font-family="Consolas, Menlo, monospace">192.0.2.13</text>
  </g>

  <!-- Cable ends -->
  <g fill="#2196f3">
    <circle cx="300" cy="230" r="5"/><circle cx="400" cy="230" r="5"/><circle cx="600" cy="230" r="5"/>
    <circle cx="716" cy="150" r="5"/><circle cx="716" cy="205" r="5"/><circle cx="716" cy="340" r="5"/><circle cx="716" cy="395" r="5"/>
  </g>

  <!-- Legend -->
  <rect x="40" y="470" width="920" height="106" rx="10" fill="#161c21" stroke="#2f3b45"/>
  <g font-size="14">
    <circle cx="64" cy="497" r="6" fill="#2196f3"/>
    <text x="80" y="502" font-weight="700" fill="#e6edf3">SIP</text>
    <text x="134" y="502" fill="#9aa7b2">UDP 5060 · call set-up</text>

    <circle cx="64" cy="523" r="6" fill="#22c55e"/>
    <text x="80" y="528" font-weight="700" fill="#e6edf3">RTP</text>
    <text x="134" y="528" fill="#9aa7b2">UDP · audio, PTT, squelch, keepalives</text>

    <circle cx="64" cy="549" r="6" fill="#f5a524"/>
    <text x="80" y="554" font-weight="700" fill="#e6edf3">SNMP</text>
    <text x="134" y="554" fill="#9aa7b2">UDP 161 · frequency read and set</text>
  </g>
  <line x1="490" y1="486" x2="490" y2="560" stroke="#2f3b45"/>
  <g font-size="13" fill="#9aa7b2">
    <text x="512" y="502">One Ethernet cable per device carries everything:</text>
    <text x="512" y="528">there is no audio wiring between the PC and the radios.</text>
    <text x="512" y="554">A transceiver is a single unit with one address.</text>
  </g>
</svg>
